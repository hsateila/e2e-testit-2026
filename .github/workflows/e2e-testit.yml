name: Cypress E2E tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run Cypress tests
        uses: cypress-io/github-action@v7
        with:
          browser: chrome
